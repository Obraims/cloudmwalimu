<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>AfriCloud Prep - Study smart. Know when you're ready.</title>
    <meta
      name="description"
      content="Study smart. Know when you're ready. Unofficial AZ-900 exam prep with local analogies. Not affiliated with or endorsed by Microsoft."
    />
    <meta name="theme-color" content="#050505" />

    <!-- Open Graph -->
    <meta property="og:title" content="AfriCloud Prep - Study smart. Know when you're ready." />
    <meta
      property="og:description"
      content="Study smart. Know when you're ready. Unofficial AZ-900 study tool for African learners."
    />
    <meta property="og:image" content="/brand/logo-mark.png" />
    <meta property="og:type" content="website" />

    <!-- Icons & Manifest -->
    <link rel="icon" type="image/svg+xml" href="/brand/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('cm-theme');
          var systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = stored === 'dark' || (!stored && systemDark) || (stored === 'system' && systemDark);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#F6F8FA] text-[#101213] dark:bg-[#050505] dark:text-[#F8FAFC] antialiased selection:bg-[#007BA7] selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
